<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Gift Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap">
<style>
:root{--bg:#f2f4ef;--surface:#fff;--ink:#1d2a26;--muted:#5b6862;--pine:#14392b;--berry:#b01e2e;--berry-ink:#fff;--line:#d9ded7;--brass:#8a6a1f;--ok:#2d6a4f;--okbg:#e2f0e8;--resbg:#f6e6e9;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--surface:#1b2623;--ink:#e8eee9;--muted:#a3b0aa;--pine:#0e1816;--berry:#e0637a;--berry-ink:#1a0a0e;--line:#2c3a36;--brass:#d9b45a;--ok:#7bd1a4;--okbg:#1e3a2e;--resbg:#3a2228;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121917;--surface:#1b2623;--ink:#e8eee9;--muted:#a3b0aa;--pine:#0e1816;--berry:#e0637a;--berry-ink:#1a0a0e;--line:#2c3a36;--brass:#d9b45a;--ok:#7bd1a4;--okbg:#1e3a2e;--resbg:#3a2228;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0;line-height:1.2}
header{background:var(--pine);color:#f3efe2;padding:14px 16px}
.bar{max-width:960px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font:400 1.35rem "Young Serif",Georgia,serif;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
select,input,textarea,button{font:inherit}
select,input,textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;width:100%}
header select{width:auto;background:#fff;color:#1d2a26}
main{max-width:960px;margin:auto;padding:20px 16px 60px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;font-size:.88rem;color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.member{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:inherit}
.member:hover,.member:focus-visible{border-color:var(--berry)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:400 1.15rem "Young Serif",serif;background:var(--pine);color:#f3efe2}
.m-name{font-weight:700}.m-sub{font-size:.85rem;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.tools input{flex:1 1 220px}.tools select{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn.pri{background:var(--berry);border-color:var(--berry);color:var(--berry-ink)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.88rem}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.gift{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:8px}
.gift .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.price{font-weight:700}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:700}
.tag.avail{background:var(--okbg);color:var(--ok)}.tag.res{background:var(--resbg);color:var(--berry)}.tag.sur{border:1px dashed var(--brass);color:var(--brass)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.9rem}
a{color:var(--berry)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:12px 0 4px}
.err{color:var(--berry);font-size:.88rem;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pine);color:#f3efe2;padding:10px 18px;border-radius:99px;font-weight:600;max-width:90vw}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
.strip{display:flex;gap:6px;overflow-x:auto;width:100%;padding:10px 0 2px}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 14px 5px 6px;background:rgba(255,255,255,.1);color:#f3efe2;border:2px solid transparent;cursor:pointer;font-weight:600}
.chip:hover{background:rgba(255,255,255,.2)}
.chip .av{width:30px;height:30px;font-size:.9rem;background:#f3efe2;color:#1f3b34}
.chip[aria-checked=true]{background:#f3efe2;color:#1f3b34;border-color:var(--berry)}
.chip[aria-checked=true] .av{background:var(--berry);color:var(--berry-ink)}
.who strong{font-weight:700}
.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ov{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.ovh{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.ovh:hover .m-name{color:var(--berry)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rn{flex:1;min-width:0;overflow-wrap:anywhere}
.ov .btn.link{align-self:flex-start;padding:0;min-height:36px}
:root{--gold:#e8c766;--snow:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--snow:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--snow:rgba(255,255,255,.05)}
body{background-image:radial-gradient(circle,var(--snow) 1.6px,transparent 2.2px);background-size:44px 44px}
header{border-bottom:5px solid transparent;border-image:repeating-linear-gradient(135deg,#b01e2e 0 14px,#f7f3ea 14px 28px) 1}
.hero{background:var(--pine);color:#f3efe2;border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:-7px;padding:28px 26px;margin-bottom:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero .big{font:400 clamp(2.8rem,10vw,4.2rem)/1 "Young Serif",Georgia,serif;color:var(--gold)}
.hs{line-height:1.7}.hs strong{color:var(--gold);font-size:1.35rem;margin-right:4px}
.ov{border-top:4px solid var(--berry)}
.ov:nth-child(even){border-top-color:#2d6a4f}
.ovh .av{background:var(--berry);color:var(--berry-ink)}
.ov:nth-child(even) .ovh .av{background:#2d6a4f;color:#fff}
.gift{border-left:4px solid var(--berry)}
dialog{border-top:4px solid var(--berry)}
.tag.sur{border-color:var(--gold)}
/* Sharper corners */
.note,select,input,textarea,.btn,.chip,.toast{border-radius:2px}
.member,.gift,.empty,dialog,.av,.ov{border-radius:3px}
.tag{border-radius:2px}
</style>
</head>
<body>
<header><div class="bar">
<button class="brand" id="home">🎄 Family Gift Hub</button>
<label class="who" style="margin:0">Test as <select id="me" aria-label="Prototype only: switch family member"></select></label>
</div></header>
<main id="app"></main>
<dialog id="dlg"><form id="gf" method="dialog"></form></dialog>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const names=["Grandma Rose","Grandpa Joe","Mom","Dad","Aunt Carla","Uncle Mike","Maya","Ben","Priya","Leo","Nana June"];
const members=names.map((n,i)=>({id:"m"+i,email:"member"+i+"@example.com",name:n,role:i<2||i==10?"Grandparent":i<4?"Parent":i<6?"Aunt / Uncle":"Cousin"}));
let n=0;const G=(o,name,price,url,notes,by,claimedBy,surprise)=>({id:++n,owner:"m"+o,name,price,url,notes,by:by??"m"+o,claimedBy:claimedBy??null,purchased:false,surprise:!!surprise});
let gifts=[
G(2,"Cast iron skillet, 10 inch",35,"https://example.com/skillet","Pre-seasoned please"),
G(2,"Fuzzy slippers",28,"","Size 8, gray",null,"m3"),
G(3,"Cordless drill set",120,"https://example.com/drill","",null,null),
G(6,"Watercolor paint set",42,"https://example.com/paint","The 24-color one"),
G(6,"Sketchbook",null,"","Any, A5 size",null,"m7"),
G(0,"Garden gloves",15,"","Medium"),
G(7,"Trail running shoes",95,"https://example.com/shoes","Size 10, blue",null,"m2"),
G(8,"Hardcover novel",null,"","Surprise me with fiction")
];
let me="m2",page="dash",view=null,q="",sort="name";
const $=s=>document.querySelector(s),app=$("#app"),dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=id=>members.find(m=>m.id===id).name;
const toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)};
function renderStrip(){const s=$("#me");s.innerHTML=members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");s.value=me}
$("#me").onchange=e=>{me=e.target.value;render()};
$("#home").onclick=()=>{page="dash";render()};

// Visibility rule (in Firebase this must be enforced by Security Rules, not the UI)
const visible=o=>gifts.filter(g=>g.owner===o&&(o!==me||!g.surprise));
// Simulated atomic claim: re-check state at write time, like a Firestore transaction.
function claim(id){const g=gifts.find(x=>x.id===id);
 if(!g)return toast("That gift was removed.");
 if(g.owner===me)return toast("You can’t claim your own gift.");
 if(g.claimedBy)return toast("Someone just claimed this one.");
 g.claimedBy=me;toast("Claimed. Only others can see it’s you.");render()}
function unclaim(id){const g=gifts.find(x=>x.id===id);if(g&&g.claimedBy===me){g.claimedBy=null;g.purchased=false;toast("Claim removed.");render()}}
function buy(id){const g=gifts.find(x=>x.id===id);if(g&&g.claimedBy===me){g.purchased=!g.purchased;render()}}
function del(id){if(confirm("Remove this gift?")){gifts=gifts.filter(g=>g.id!==id);toast("Gift removed.");render()}}

function render(){renderStrip();page==="dash"?dash():list()}
let mid=100;
// Replace with your own email. Add/remove member controls show only for the account signed in with this email.
const ADMIN_EMAIL="member2@example.com";
const isAdmin=()=>members.find(m=>m.id===me)?.email===ADMIN_EMAIL;
function manage(m,own){const b=(own?`<button class="btn sm" data-rename="${m.id}">Change my name</button>`:"")+(isAdmin()&&!own?`<button class="btn sm" data-remove="${m.id}">Remove member</button>`:"");return b?`<div class="acts">${b}</div>`:""}
function nameForm(title,val,save){
 $("#gf").innerHTML=`<h2>${title}</h2><label for="nn">Name</label><input id="nn" required maxlength="40" value="${esc(val)}"><div class="err" id="fe" role="alert"></div><div class="acts" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn" id="fc">Cancel</button><button type="submit" class="btn pri">Save name</button></div>`;
 $("#fc").onclick=()=>dlg.close();
 $("#gf").onsubmit=e=>{e.preventDefault();const v=$("#nn").value.trim().replace(/\s+/g," ");
  if(!v){$("#fe").textContent="Enter a name.";return}
  if(members.some(m=>m.name.toLowerCase()===v.toLowerCase()&&m.name!==val)){$("#fe").textContent="Someone in the family already has that name.";return}
  save(v);dlg.close();render()};
 dlg.showModal();$("#nn").select();
}
// Only the signed-in person can rename themselves. Firestore rules must enforce this too.
function renameMe(id){if(id!==me)return toast("You can only change your own name.");const m=members.find(x=>x.id===id);nameForm("Change my name",m.name,v=>{m.name=v;toast("Name updated.")})}
function addMember(){if(!isAdmin())return toast("Only the family admin can add members.");nameForm("Add a family member","",v=>{members.push({id:"m"+(++mid),name:v,role:"Family"});toast(v+" added.")})}
function removeMember(id){if(!isAdmin()||id===me)return toast("Only the family admin can remove other members.");const m=members.find(x=>x.id===id);
 if(!confirm("Remove "+m.name+"? Their wishlist and any surprise gifts they added for others will be deleted, and their claims will be released."))return;
 gifts=gifts.filter(g=>g.owner!==id&&g.by!==id);gifts.forEach(g=>{if(g.claimedBy===id){g.claimedBy=null;g.purchased=false}});
 members.splice(members.indexOf(m),1);toast(m.name+" removed.");render()}
function hero(){
 const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),now.getDate());let t=new Date(s.getFullYear(),11,25);if(t<s)t=new Date(s.getFullYear()+1,11,25);
 const d=Math.round((t-s)/864e5),v=members.flatMap(m=>visible(m.id)),c=v.filter(g=>g.claimedBy).length;
 return`<section class="hero"><div><div class="big">${d||"Today"}</div><div>${d?(d==1?"day":"days")+" until Christmas":"is Christmas. Merry Christmas!"}</div></div><div class="hs"><strong>${v.length}</strong>gifts on the lists<br><strong>${c}</strong>already claimed</div></section>`}
function status(g,own){return g.claimedBy?`<span class="tag res">${own?"Reserved":g.claimedBy===me?"Yours":"Claimed"}</span>`:'<span class="tag avail">Available</span>'}
function overview(m){
 const gs=visible(m.id),open=gs.filter(g=>!g.claimedBy).length,own=m.id===me;
 const rows=gs.slice(0,4).map(g=>`<li class="row"><span class="rn">${esc(g.name)}${g.price!=null?` <span class="muted">$${Number(g.price).toFixed(0)}</span>`:""}</span>${status(g,own)}${!own&&!g.claimedBy?`<button class="btn sm pri" data-claim="${g.id}">Claim</button>`:""}</li>`).join("");
 return`<section class="ov"><button class="ovh" data-open="${m.id}"><span class="av" aria-hidden="true">${esc(m.name[0])}</span><span><span class="m-name">${esc(m.name)}${own?" (you)":""}</span><br><span class="m-sub">${gs.length?`${gs.length} ${gs.length==1?"gift":"gifts"}, ${open} available`:"No gifts yet"}</span></span></button>
 ${rows?`<ul class="rows">${rows}</ul>`:'<p class="muted" style="margin:0">Nothing listed yet.</p>'}
 ${gs.length>4?`<button class="btn link" data-open="${m.id}">See all ${gs.length} gifts</button>`:""}${manage(m,own)}</section>`}
function dash(){
 const k=q.toLowerCase(),f=members.filter(m=>m.name.toLowerCase().includes(k)||visible(m.id).some(g=>g.name.toLowerCase().includes(k)));
 app.innerHTML=`<div class="note">Prototype: data lives in this page only and resets on reload. Privacy is shown here by the interface; the real version must enforce it, including who can rename or remove members, with Firebase Security Rules.</div>
 ${hero()}<h1>Our family</h1><p class="muted">${members.length} members. See what everyone wants at a glance, claim a gift here, or open a full list.</p>
 <div class="tools"><input id="s" type="search" placeholder="Search people or gifts" aria-label="Search people or gifts" value="${esc(q)}">${isAdmin()?'<button class="btn pri" id="addm">Add member</button>':""}</div>
 <div class="grid">${f.map(overview).join("")||'<div class="empty">No one matches that search.</div>'}</div>`;
 const s=$("#s");s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;dash();const t=$("#s");t.focus();t.setSelectionRange(p,p)};
 app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{view=b.dataset.open;page="list";render()});
 app.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>claim(+b.dataset.claim));
 app.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>renameMe(b.dataset.rename));
 app.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeMember(b.dataset.remove));
 const am=$("#addm");if(am)am.onclick=addMember;
}
function list(){
 const own=view===me;let gs=visible(view);
 gs=[...gs].sort((a,b)=>sort==="price"?(a.price??1e9)-(b.price??1e9):sort==="avail"?(!!a.claimedBy)-(!!b.claimedBy):a.name.localeCompare(b.name));
 app.innerHTML=`<button class="btn link" id="back">Back to family</button>
 <div class="tools" style="justify-content:space-between"><h1>${own?"My wishlist":esc(nm(view))+"’s wishlist"}</h1>
 <button class="btn pri" id="add">${own?"Add a gift":"Add a surprise gift"}</button></div>
 ${own?'<p class="muted">You can see whether a gift is reserved, but never who reserved it.</p>':'<p class="muted">Gifts you add here are surprises. '+esc(nm(view))+' won’t see them.</p>'}
 <div class="tools"><label class="muted" style="margin:0">Sort by
 <select id="sort" style="width:auto;margin-left:6px"><option value="name">Name</option><option value="price">Price</option><option value="avail">Availability</option></select></label></div>
 ${gs.map(card).join("")||`<div class="empty">${own?"Your list is empty. Add the first thing you’d like.":"Nothing here yet. Add a gift idea."}</div>`}`;
 $("#sort").value=sort;$("#sort").onchange=e=>{sort=e.target.value;list()};
 $("#back").onclick=()=>{page="dash";render()};
 $("#add").onclick=()=>form();
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const id=+b.dataset.id,a=b.dataset.a;({claim,unclaim,buy,del,edit:i=>form(i)})[a](id)});
}
function card(g){
 const mine=g.claimedBy===me,own=g.owner===me;
 let tag;
 if(g.surprise)tag='<span class="tag sur">Surprise</span> ';else tag="";
 if(g.claimedBy)tag+=`<span class="tag res">${own?"Reserved":mine?"Claimed by you":"Claimed by "+esc(nm(g.claimedBy))}</span>`;else tag+='<span class="tag avail">Available</span>';
 if(!own&&g.purchased)tag+=' <span class="tag avail">Purchased</span>';
 const acts=[];
 if(!own&&!g.claimedBy)acts.push(`<button class="btn sm pri" data-a="claim" data-id="${g.id}">Claim</button>`);
 if(mine){acts.push(`<button class="btn sm" data-a="unclaim" data-id="${g.id}">Unclaim</button>`,`<button class="btn sm" data-a="buy" data-id="${g.id}">${g.purchased?"Mark not purchased":"Mark purchased"}</button>`)}
 if(g.by===me)acts.push(`<button class="btn sm" data-a="edit" data-id="${g.id}">Edit</button>`,`<button class="btn sm" data-a="del" data-id="${g.id}">Remove</button>`);
 return`<article class="gift"><div class="top"><h3>${esc(g.name)}</h3><span class="price">${g.price!=null?"$"+Number(g.price).toFixed(2):""}</span></div>
 <div>${tag}</div>${g.notes?`<div class="muted">${esc(g.notes)}</div>`:""}
 ${g.url?`<div><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">View product page</a></div>`:""}
 <div class="acts">${acts.join("")}</div></article>`}

function form(id){
 const g=id?gifts.find(x=>x.id===id):{},own=view===me;
 $("#gf").innerHTML=`<h2>${id?"Edit gift":own?"Add a gift":"Add a surprise gift"}</h2>
 <label for="fn">Gift name</label><input id="fn" required maxlength="120" value="${esc(g.name)}">
 <label for="fu">Product link (optional)</label><input id="fu" type="url" inputmode="url" placeholder="https://" value="${esc(g.url)}">
 <label for="fp">Price in dollars (optional)</label><input id="fp" type="number" min="0" max="100000" step="0.01" value="${g.price??""}">
 <label for="fno">Notes: size, color, preferences (optional)</label><textarea id="fno" rows="3" maxlength="500">${esc(g.notes)}</textarea>
 <div class="err" id="fe" role="alert"></div>
 <div class="acts" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn" id="fc">Cancel</button><button type="submit" class="btn pri">Save gift</button></div>`;
 $("#fc").onclick=()=>dlg.close();
 $("#gf").onsubmit=e=>{e.preventDefault();
  const name=$("#fn").value.trim(),url=$("#fu").value.trim(),pr=$("#fp").value;
  let err="";if(!name)err="Enter a gift name.";
  else if(url&&!/^https?:\/\/[^\s]+\.[^\s]+$/i.test(url))err="Link must start with http:// or https://.";
  if(err){$("#fe").textContent=err;return}
  const d={name,url,price:pr===""?null:+pr,notes:$("#fno").value.trim()};
  if(id)Object.assign(g,d);else gifts.push({id:++n,owner:view,by:me,claimedBy:null,purchased:false,surprise:!own,...d});
  dlg.close();toast("Gift saved.");render()};
 dlg.showModal();$("#fn").focus();
}
render();
</script>
</body>
</html>
